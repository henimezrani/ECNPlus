services:
  - type: web
    name: ecn-companion
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ecnplus.cloud_admin migrate && gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ACCESS_CODE_YASMINE
        sync: false
      - key: ACCESS_CODE_HOUSSEIN
        sync: false
      - key: ACCESS_CODE_AUTRE
        sync: false
      - key: ACCESS_CODE_THABET
        sync: false
