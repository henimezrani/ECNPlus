<!doctype html>
<html lang="fr-TN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#254d40">
  <title>ECN Companion · Choisir un espace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="profile-chooser-page">
  <main class="profile-chooser">
    <a class="brand chooser-brand" href="/" aria-label="ECN Companion">
      <span class="brand-mark"><svg class="icon"><use href="#i-plus"/></svg></span>
      <span>ECN<span class="brand-sub">Companion</span></span>
    </a>
    <p class="eyebrow">SUIVI DES RÉVISIONS</p>
    <h1>Choisir un espace</h1>
    <p class="chooser-intro">Chaque espace conserve ses propres données, paramètres et jeton ECNPlus sur cet ordinateur.</p>
    <nav class="profile-options" aria-label="Espaces de révision">
      <a href="/yasmine/"><span>Yasmine</span><span aria-hidden="true">→</span></a>
      <a href="/houssein/"><span>Houssein</span><span aria-hidden="true">→</span></a>
      <a href="/autre/"><span>Autre</span><span aria-hidden="true">→</span></a>
    </nav>
    <p class="local-access-note">Accès local sans connexion. Toute personne utilisant cet ordinateur peut ouvrir ces espaces.</p>
  </main>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>
</body>
</html>
